services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8888:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    expose:
      - "8080"
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/libation.db
      AUDIBLE_SVC_URL: http://audible-svc:8081
      APP_URL: ${APP_URL:-http://localhost:8888}
      OUTPUT_DIR: /audiobooks
      DOWNLOAD_WORKERS: "3"
    volumes:
      - ./data/db:/data
      - ./data/audiobooks:/audiobooks
    depends_on:
      audible-svc:
        condition: service_healthy
    restart: unless-stopped

  audible-svc:
    build:
      context: ./audible-svc
    environment:
      ACCOUNTS_DIR: /data/accounts
    volumes:
      - audible-tokens:/data
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  audible-tokens:
