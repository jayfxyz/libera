services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8888:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    expose:
      - "8080"
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/libation.db
      AUDIBLE_SVC_URL: http://audible-svc:8081
      APP_URL: ${APP_URL:-http://localhost:8888}
      OUTPUT_DIR: /audiobooks
      DOWNLOAD_WORKERS: "3"
      OTEL_SERVICE_NAME: web-libation-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    volumes:
      - ./data/db:/data
      - ./data/audiobooks:/audiobooks
    depends_on:
      jaeger:
        condition: service_started
      audible-svc:
        condition: service_healthy
    restart: unless-stopped

  audible-svc:
    build:
      context: ./audible-svc
    environment:
      ACCOUNTS_DIR: /data/accounts
      OTEL_SERVICE_NAME: audible-svc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    volumes:
      - audible-tokens:/data
    expose:
      - "8081"
    depends_on:
      - jaeger
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  audible-tokens:
