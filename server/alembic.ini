# For the alembic CLI during development, e.g.
#   DATABASE_PATH=../data/db/libera.db alembic revision --autogenerate -m "..."
# The app itself migrates on startup (app/db/migrate.py).
[alembic]
script_location = app/db/migrations
prepend_sys_path = .

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
